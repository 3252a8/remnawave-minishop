# The combined log includes the URL and Referer; either can carry a subscription token.
map $uri $log_subscription_request {
    default 1;
    ~*^/(?:s|api/subscription-guides/public)/ 0;
}
map $http_referer $log_subscription_referer {
    default 1;
    ~*/(?:s|api/subscription-guides/public)/ 0;
}
map "$log_subscription_request$log_subscription_referer" $log_subscription_safe {
    default 0;
    "11" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log combined if=$log_subscription_safe;
    # 96 MiB plugin ZIP plus multipart framing; backend keeps per-endpoint limits.
    client_max_body_size 97m;

    gzip on;
    gzip_static on;
    brotli_static on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
        try_files /robots.txt =404;
    }

    location = /api {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    # Proxy error logs include the request URL and cannot redact individual fields.
    # Keep diagnostics for credential-bearing routes in the redacted backend log.
    location ^~ /api/subscription-guides/public/ {
        access_log off;
        error_log /dev/null;
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    # Signed plugin assets use .js/.css paths under /api/ and must bypass the
    # generic static-file regex below.
    location ^~ /api/ {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    location = /auth {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    location /auth/ {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    location = /open-app {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    location = /webapp-logo {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    location = /webapp-default-logo.webp {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    location ~ ^/(favicon\.ico|apple-touch-icon(?:-precomposed)?\.png|icon-(?:192|512)\.png)$ {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    location ~ ^/(webapp-logo|webapp-uploaded-logo|webapp-favicon|webapp-theme-css|webapp-theme-assets)/ {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    # The subscription response must never fall back to the static HTML shell.
    location ^~ /s/ {
        access_log off;
        error_log /dev/null;
        # Remnawave client settings can exceed nginx's default response-header buffer.
        # Backend accepts at most 64 KiB of upstream headers, plus its own metadata.
        proxy_buffer_size 128k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 128k;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_intercept_errors off;
        proxy_connect_timeout 8s;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    # Ask the backend for the document shell so the selected theme tokens are
    # present before the first paint. If the backend is temporarily unavailable,
    # keep the prebuilt shell as a bounded startup fallback.
    location ~ "^/(?:$|login/password$|home$|plans$|checkout(?:/[a-fA-F0-9]{32})?$|install$|trial$|invite$|partner$|devices$|settings(?:/(?:security|notifications))?$|unsubscribe$|status$|support(?:/[0-9]+)?$|admin(?:/.*)?$)" {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
        proxy_connect_timeout 1s;
        proxy_read_timeout 4s;
        proxy_send_timeout 4s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @webapp_static_shell;
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    location @webapp_static_shell {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
        try_files /index.html =404;
    }

    location ~* ^/subscription_webapp(_admin)?\.(min\.)?[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]\.(css|js)$ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
        try_files $uri =404;
    }

    # Code-split chunks of both bundles. Their names are content-hashed, so they
    # are immutable. The middle segment allows dots because a chunk inherits
    # them from its entry module (a store written in `*.svelte.ts`).
    location ~* ^/subscription_webapp(_admin)?\.[A-Za-z0-9_.-]+\.[A-Za-z0-9_-]+\.js$ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
        try_files $uri =404;
    }

    location ~* ^/subscription_webapp(_admin)?\.(css|js)$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
        try_files $uri =404;
    }

    # Keep the original document URLs available. Proxy them explicitly so
    # unknown or empty documents are rejected by the backend instead of falling
    # through to the static SPA shell.
    location ~ "^/docs/[a-z0-9][a-z0-9-]{0,63}(?:/[a-z0-9][a-z0-9-]{0,63})*$" {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    # Information pages are data-backed, unlike the ordinary static SPA routes:
    # proxy their extensionless paths so the backend can reject unknown routes
    # and resolve managed documents or Markdown inside data/legal or data/pages.
    location ~ ^/(?!api(?:/|$)|auth(?:/|$)|admin(?:/|$)|fonts(?:/|$)|webapp-|subscription_webapp|favicon\.ico$|robots\.txt$|health$)[a-z0-9][a-z0-9_-]*(?:/[a-z0-9][a-z0-9_-]*)*$ {
        proxy_pass ${WEBAPP_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header Host ${WEBAPP_BACKEND_UPSTREAM_HOST_VALUE};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Minishop-Frontend-Host $host;
        proxy_set_header ${MINISHOP_EDGE_TOKEN_HEADER_VALUE} "${MINISHOP_EDGE_TOKEN_VALUE}";
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
        try_files $uri /index.html;
    }
}
