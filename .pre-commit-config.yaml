repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: npm-lockfiles-sync
        name: npm lockfiles are synchronized
        entry: node scripts/check_npm_lockfiles.mjs
        language: system
        files: ^(frontend|docs-site)/package(-lock)?\.json$|^scripts/check_npm_lockfiles\.mjs$

      - id: docs-openapi-sync
        name: docs OpenAPI artifact sync
        entry: npm --prefix docs-site run check:openapi-sync
        language: system
        files: ^(docs/(openapi\.json|remnawave-minishop\.webp)|docs-site/public/(openapi\.json|remnawave-minishop\.webp)|docs-site/scripts/(sync-docs|check-openapi-sync)\.mjs)$
        pass_filenames: false

      - id: frontend-prettier
        name: frontend prettier
        entry: npm --prefix frontend run format
        language: system
        files: ^frontend/(src/.*\.(js|ts|svelte)|scripts/.*\.mjs)$
        pass_filenames: false
