x-logging: &minishop_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  demo:
    logging: *minishop_logging
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./docs-site/public:/usr/share/nginx/html:ro
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
