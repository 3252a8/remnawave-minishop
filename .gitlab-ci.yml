stages:
  - verify
  - publish

build-docs:
  stage: verify
  image: node:24-trixie-slim
  variables:
    CF_PAGES_COMMIT_SHA: $CI_COMMIT_SHA
    CF_PAGES_BRANCH: $CI_COMMIT_BRANCH
    PYTHON: python3
  before_script:
    - |
      set -eu
      apt-get -o Acquire::Retries=5 update --error-on=any
      apt-get -o Acquire::Retries=5 install --yes --no-install-recommends python3 python3-pil ca-certificates
    - python3 -c "import sys; from PIL import Image; assert sys.version_info >= (3, 12)"
  script:
    - npm --prefix docs-site ci --no-audit --no-fund
    - npm run check:docs
    - npm run build:docs
  artifacts:
    paths:
      - docs-site/dist/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/ && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'

publish-docs:
  stage: publish
  image: node:24-trixie-slim
  needs: [build-docs]
  resource_group: documentation-$CI_COMMIT_BRANCH
  interruptible: false
  timeout: 15m
  environment:
    name: documentation/$CI_COMMIT_BRANCH
  before_script:
    - |
      set -eu
      apt-get -o Acquire::Retries=5 update --error-on=any
      apt-get -o Acquire::Retries=5 install --yes --no-install-recommends python3 git ca-certificates
    - test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is required for the documentation environment" >&2; exit 1)
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is required" >&2; exit 1)
    - npm install --prefix /tmp/pages-cli --no-save --package-lock=false --no-audit --no-fund wrangler@4.162.0
    - export PATH="/tmp/pages-cli/node_modules/.bin:$PATH"
  script:
    - python3 scripts/publish_docs.py
  artifacts:
    when: always
    paths:
      - pages-deployment.ndjson
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/ && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
