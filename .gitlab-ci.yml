stages:
  - publish

variables:
  # The Dockerfile derives the application version from the repository history.
  GIT_DEPTH: "0"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

.publish-dockerhub-images:
  stage: publish
  image: docker:27.4.1-cli
  services:
    - name: docker:27.4.1-dind
  before_script:
    - apk add --no-cache bash git
    - test -n "$DOCKERHUB_USERNAME" || (echo "DOCKERHUB_USERNAME is required" >&2; exit 1)
    - test -n "$DOCKERHUB_TOKEN" || (echo "DOCKERHUB_TOKEN is required" >&2; exit 1)
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
  after_script:
    - docker logout

publish-dev-images:
  extends: .publish-dockerhub-images
  resource_group: dockerhub-dev-images
  script:
    - |
      remote_dev_commit="$(git ls-remote origin refs/heads/dev | awk '{print $1}')"
      if [ "$CI_COMMIT_SHA" != "$remote_dev_commit" ]; then
        echo "Skipping superseded dev commit $CI_COMMIT_SHA (current: $remote_dev_commit)"
        exit 0
      fi
      build_provenance=custom
      if [ "$CI_PROJECT_PATH" = "3252a8/remnawave-minishop" ]; then
        build_provenance=official
      fi
      IMAGE_TAG=dev OCI_IMAGE_REVISION="$CI_COMMIT_SHA" REMNAWAVE_MINISHOP_BRANCH="$CI_COMMIT_REF_NAME" REMNAWAVE_MINISHOP_BUILD_PROVENANCE="$build_provenance" bash ./scripts/dockerhub-build-push-images.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "web"'

publish-release-images:
  extends: .publish-dockerhub-images
  resource_group: dockerhub-release-images
  script:
    - |
      remote_main_commit="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
      if [ -z "$remote_main_commit" ]; then
        echo "Unable to resolve the current main commit" >&2
        exit 1
      fi
      if [ "$CI_COMMIT_SHA" != "$remote_main_commit" ]; then
        echo "Release tag $CI_COMMIT_TAG must point exactly at current main ($remote_main_commit)" >&2
        exit 1
      fi

      build_provenance=custom
      if [ "$CI_PROJECT_PATH" = "3252a8/remnawave-minishop" ]; then
        build_provenance=official
      fi
      dockerhub_owner="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')"
      release_version="${CI_COMMIT_TAG#v}"
      IMAGE_TAG="$release_version" OCI_IMAGE_REVISION="$CI_COMMIT_SHA" REMNAWAVE_MINISHOP_BRANCH=main REMNAWAVE_MINISHOP_BUILD_TAG="$CI_COMMIT_TAG" REMNAWAVE_MINISHOP_BUILD_COMMIT="$CI_COMMIT_SHA" REMNAWAVE_MINISHOP_BUILD_PROVENANCE="$build_provenance" bash ./scripts/dockerhub-build-push-images.sh

      for target in backend worker frontend; do
        version_image="docker.io/${dockerhub_owner}/remnawave-minishop-$target:$release_version"
        latest_image="docker.io/${dockerhub_owner}/remnawave-minishop-$target:latest"
        docker tag "$version_image" "$latest_image"
        docker push "$latest_image"
      done
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
