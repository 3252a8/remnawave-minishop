stages:
  - verify
  - publish
  - dispatch

variables:
  # The Dockerfile derives the application version from the repository history.
  GIT_DEPTH: "0"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_DRIVER: overlay2
  COSIGN_YES: "true"
  COSIGN_EXPERIMENTAL: "1"
  TRIVY_TIMEOUT: "30m"

build-docs:
  stage: verify
  image: node:24-trixie-slim
  variables:
    CF_PAGES_COMMIT_SHA: $CI_COMMIT_SHA
    CF_PAGES_BRANCH: $CI_COMMIT_BRANCH
    PYTHON: python3
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends python3 python3-pil ca-certificates
    - python3 -c "import sys; from PIL import Image; assert sys.version_info >= (3, 12)"
  script:
    - npm --prefix docs-site ci --no-audit --no-fund
    - npm run check:docs
    - npm run build:docs
  artifacts:
    paths:
      - docs-site/dist/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/ && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'

publish-docs:
  stage: publish
  image: node:24-trixie-slim
  needs: [build-docs]
  resource_group: documentation-$CI_COMMIT_BRANCH
  interruptible: false
  timeout: 15m
  environment:
    name: documentation/$CI_COMMIT_BRANCH
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends python3 git ca-certificates
    - test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is required for the documentation environment" >&2; exit 1)
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is required" >&2; exit 1)
    - npm install --prefix /tmp/pages-cli --no-save --package-lock=false --no-audit --no-fund wrangler@4.151.2
    - export PATH="/tmp/pages-cli/node_modules/.bin:$PATH"
  script:
    - python3 scripts/publish_docs.py
  artifacts:
    when: always
    paths:
      - pages-deployment.ndjson
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/ && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'

.publish-dockerhub-images:
  stage: publish
  timeout: 2h
  retry:
    max: 1
    when:
      - runner_external_dependency_failure
      - script_failure
  image: docker:29.9.1-cli
  services:
    - name: docker:29.9.1-dind
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache bash coreutils curl git jq
    # Cosign 3.1.3 fixes GHSA-fx35-mq7g-6g98 and preserves the existing v3 bundle format.
    - |
      case "$(uname -m)" in
        x86_64)
          cosign_arch=amd64
          cosign_sha256=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
          ;;
        aarch64)
          cosign_arch=arm64
          cosign_sha256=c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
          ;;
        *) echo "Unsupported Cosign architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl --fail --location --silent --show-error --retry 5 \
        --output /usr/local/bin/cosign \
        "https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-${cosign_arch}"
      printf '%s  /usr/local/bin/cosign\n' "$cosign_sha256" | sha256sum --check -
      chmod 0755 /usr/local/bin/cosign
      cosign version --json | jq -e '.gitVersion == "v3.1.3"' > /dev/null
    - test -n "$DOCKERHUB_USERNAME" || (echo "DOCKERHUB_USERNAME is required" >&2; exit 1)
    - test -n "$DOCKERHUB_TOKEN" || (echo "DOCKERHUB_TOKEN is required" >&2; exit 1)
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
  after_script:
    - docker logout

publish-test-runtime:
  extends: .publish-dockerhub-images
  stage: verify
  resource_group: dockerhub-test-runtime
  variables:
    MINISHOP_TEST_RUNTIME_CANDIDATE: "1"
  before_script:
    - apk add --no-cache nodejs git tar
    - test "$DOCKERHUB_USERNAME" = "3252a8"
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then node scripts/test_runtime.mjs refresh; fi
    - MINISHOP_LOCAL_TEST_RUNTIME=container node scripts/run_pytest.mjs tests/unit/test_full_test_run.py tests/unit/test_source_files.py
    - node scripts/test_runtime.mjs publish
  artifacts:
    paths:
      - deploy/docker/test-runtime.lock.json
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule")'
      changes:
        - deploy/docker/Dockerfile
        - deploy/docker/refresh_pip_vendor.py
        - backend/requirements.txt
        - requirements-dev.txt
        - scripts/test_runtime.mjs
        - .gitlab-ci.yml

publish-dev-images:
  extends: .publish-dockerhub-images
  resource_group: dockerhub-dev-images
  variables:
    PUBLISH_CHANNEL: dev
  script: bash ./scripts/gitlab-publish-images.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "web"'

publish-release-images:
  extends: .publish-dockerhub-images
  resource_group: dockerhub-release-images
  variables:
    PUBLISH_CHANNEL: release
  script: bash ./scripts/gitlab-publish-images.sh
  artifacts:
    name: release-images-$CI_COMMIT_SHA-$CI_PIPELINE_ID
    paths:
      - release-images.json
      - release-images.json.sha256
      - release-images.json.sigstore.json
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

dispatch-dev-image-consumer:
  stage: dispatch
  needs:
    - publish-dev-images
  variables:
    CORE_DEV_COMMIT: $CI_COMMIT_SHA
    CORE_DEV_IMAGE_PREFIX: docker.io/3252a8/remnawave-minishop
    CORE_DEV_UPSTREAM_PIPELINE_URL: $CI_PIPELINE_URL
  trigger:
    project: $IMAGE_CHANNEL_DOWNSTREAM_PROJECT
    # The consumer's default branch is the channel contract. Passing an
    # explicit variable ref intermittently failed in GitLab with "Commit not found".
    strategy: mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push" && $IMAGE_CHANNEL_DOWNSTREAM_PROJECT != ""'
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "web" && $IMAGE_CHANNEL_DOWNSTREAM_PROJECT != ""'
