# pip vendors only pkg_resources, not the vulnerable setuptools.package_index.
# https://pip.pypa.io/en/stable/development/vendoring-policy/#modifications
# https://github.com/advisories/GHSA-5rjg-fvgr-3xxf
# refresh_pip_vendor.py rejects a full setuptools 70.3.0 installation.
# Remove/review this exception when pip changes its bundled setuptools version.
vulnerabilities:
  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    expired_at: 2027-01-01
    statement: >-
      Component not present: pip 26.2.1 contains pkg_resources only;
      setuptools.package_index.PackageIndex.download is absent from the image.
