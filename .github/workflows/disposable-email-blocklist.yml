name: Refresh disposable-email blocklist

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: disposable-email-blocklist-refresh
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh blocklist
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/update_disposable_email_blocklist.py
          if git diff --quiet -- backend/config/disposable_email_blocklist.conf; then
            echo "The snapshot is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Install the app on this repository only. Its PRs trigger checks without manual approval.
      - name: Create the blocklist app token
        id: blocklist-app
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BLOCKLIST_APP_CLIENT_ID }}
          private-key: ${{ secrets.BLOCKLIST_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update review pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.blocklist-app.outputs.token }}
        run: |
          branch="automation/disposable-email-blocklist"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add backend/config/disposable_email_blocklist.conf
          git commit -m "chore: refresh disposable email domains"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push --force-with-lease origin "HEAD:$branch"

          existing_pr="$(gh pr list --base dev --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base dev \
              --head "$branch" \
              --title "chore: refresh disposable email domains" \
              --body "Automated weekly refresh of the vendored disposable-email snapshot. Review source changes before merging; production never fetches these lists at runtime."
          fi
