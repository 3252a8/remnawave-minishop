name: Docker build (reusable)

# Reusable pull-request check for the three image targets. This workflow never
# authenticates to a registry and never publishes images or attestations.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lockfiles:
    name: Validate npm lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs-site/package-lock.json

      - name: Check npm lockfiles
        run: npm run check:lockfiles

  build:
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build all runtime images
        uses: docker/bake-action@v7
        env:
          CACHE_SUFFIX: ci
        with:
          source: .
          files: deploy/docker/images.hcl
          push: false
          pull: true
          set: |
            *.args.GITHUB_REF_NAME=${{ github.ref_name }}
            *.args.REMNAWAVE_MINISHOP_BUILD_PROVENANCE=${{ github.repository == '3252a8/remnawave-minishop' && 'official' || 'custom' }}
          provenance: false
          sbom: false
