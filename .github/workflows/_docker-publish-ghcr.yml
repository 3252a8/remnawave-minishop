name: Publish Core images (reusable)

# Push each candidate to both registries from one BuildKit export.

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Commit or tag to check out"
        type: string
        required: true
      source_commit:
        description: "Immutable source commit recorded in image metadata"
        type: string
        required: true
      channel:
        description: "Publishing channel: dev or release"
        type: string
        required: true
      version:
        description: "Release version without the leading v"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  lockfiles:
    name: Validate npm lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs-site/package-lock.json

      - name: Check npm lockfiles
        run: npm run check:lockfiles

  build:
    name: Build all candidate images
    needs: lockfiles
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
      tag: ${{ steps.build-version.outputs.tag }}
    steps:
      - name: Validate publishing inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" != "dev" ] && [ "$CHANNEL" != "release" ]; then
            echo "Unsupported GHCR channel: $CHANNEL" >&2
            exit 1
          fi
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full Git commit SHA" >&2
            exit 1
          fi
          if [ "$CHANNEL" = "release" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use MAJOR.MINOR.PATCH form" >&2
            exit 1
          fi

      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Resolve application build tag
        id: build-version
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = release ]; then
            tag="v$VERSION"
          else
            tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' 2>/dev/null || true)"
          fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid application build tag: $tag" >&2
            exit 1
          fi
          refresh="$(date -u +%F)"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then refresh="$refresh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; fi
          printf 'refresh=%s\n' "$refresh" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate GHCR metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ inputs.channel == 'dev' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ inputs.channel == 'release' }}
          labels: |
            io.github.3252a8.remnawave-minishop.build-tag=${{ steps.build-version.outputs.tag }}
            org.opencontainers.image.ref.name=${{ inputs.channel == 'release' && format('v{0}', inputs.version) || 'dev' }}
            org.opencontainers.image.revision=${{ inputs.source_commit }}

      - name: Build and push all candidates
        id: build
        uses: docker/bake-action@v7
        env:
          CANDIDATE_TAG: candidate-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          CACHE_SUFFIX: ghcr
        with:
          source: .
          files: |
            deploy/docker/images.hcl
            ${{ steps.meta.outputs.bake-file-labels }}
          push: true
          pull: true
          no-cache: ${{ inputs.channel == 'release' }}
          provenance: mode=max
          sbom: true
          set: |
            *.args.VERSION_SOURCE=ci
            *.args.REMNAWAVE_MINISHOP_BRANCH=${{ inputs.channel == 'release' && 'main' || 'dev' }}
            *.args.REMNAWAVE_MINISHOP_BUILD_PROVENANCE=official
            *.args.REMNAWAVE_MINISHOP_BUILD_TAG=${{ steps.build-version.outputs.tag }}
            *.args.REMNAWAVE_MINISHOP_BUILD_COMMIT=${{ inputs.source_commit }}
            *.args.REMNAWAVE_MINISHOP_APK_REFRESH=${{ steps.build-version.outputs.refresh }}

      - name: Select immutable image digests
        id: digests
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          digests=$(jq -ce 'with_entries(.value = .value["containerimage.digest"])
            | select(keys == ["backend","frontend","worker"] and all(.[]; test("^sha256:[0-9a-f]{64}$")))' <<< "$METADATA")
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

  publish:
    name: Verify ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [backend, worker, frontend]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify application version inside the candidate
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/remnawave-minishop-${{ matrix.target }}@${{ fromJSON(needs.build.outputs.digests)[matrix.target] }}
          TARGET: ${{ matrix.target }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/sh "$IMAGE" -ec '
              target="$1"; tag="$2"; commit="$3"; channel="$4"
              if [ "$target" = frontend ]; then
                test "$(cat /build-tag)" = "${tag:-unknown}"
                test "$(cat /build-commit)" = "$commit"
              else
                test "$(cat /app/.build-tag)" = "${tag:-unknown}"
                test "$(cat /app/.build-commit)" = "$commit"
                suffix=""
                if [ "$channel" = dev ]; then suffix="-dev"; fi
                test "$(cat /app/.build-version)" = "${tag:-dev}${suffix}+g$commit"
              fi
            ' sh "$TARGET" "$TAG" "$COMMIT" "$CHANNEL"

      - name: Scan the published candidate
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/remnawave-minishop-${{ matrix.target }}@${{ fromJSON(needs.build.outputs.digests)[matrix.target] }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false

      - name: Install Cosign for Docker Hub
        uses: sigstore/cosign-installer@v4.1.4
        with:
          cosign-release: v3.1.5

      - name: Sign and verify the Docker Hub candidate
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE: docker.io/${{ github.repository_owner }}/remnawave-minishop-${{ matrix.target }}@${{ fromJSON(needs.build.outputs.digests)[matrix.target] }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CHANNEL_TAG: ${{ inputs.channel == 'release' && inputs.version || 'dev' }}
        run: |
          set -euo pipefail
          annotations=(--annotations "tag=$CHANNEL_TAG" --annotations "org.opencontainers.image.revision=$SOURCE_COMMIT")
          verify_log="$RUNNER_TEMP/cosign-verify.log"
          for publication in 1 2; do
            cosign sign --yes --registry-referrers-mode oci-1-1 "${annotations[@]}" "$IMAGE"
            for delay in 0 5 10 15 30 60 60; do
              sleep "$delay"
              if cosign verify --experimental-oci11 "${annotations[@]}" \
                --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_docker-publish-ghcr.yml@$GITHUB_REF" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE" > /dev/null 2>"$verify_log"; then
                exit 0
              fi
              cat "$verify_log" >&2
            done
            if [[ "$publication" == 2 ]] || ! grep -Fxq 'Error: no signatures found' "$verify_log"; then
              exit 1
            fi
            echo "Docker Hub has no discoverable signature for $IMAGE. Publishing the signature again."
          done

      - name: Attest the stable image
        if: inputs.channel == 'release'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/remnawave-minishop-${{ matrix.target }}
          subject-digest: ${{ fromJSON(needs.build.outputs.digests)[matrix.target] }}
          push-to-registry: true

      - name: Record verified digest
        env:
          DIGEST: ${{ fromJSON(needs.build.outputs.digests)[matrix.target] }}
          TARGET: ${{ matrix.target }}
        run: printf '%s\n' "$DIGEST" > "$TARGET.digest"

      - name: Upload verified digest
        uses: actions/upload-artifact@v7
        with:
          name: core-image-digest-${{ matrix.target }}
          path: ${{ matrix.target }}.digest
          if-no-files-found: error
          overwrite: true
          retention-days: 7
