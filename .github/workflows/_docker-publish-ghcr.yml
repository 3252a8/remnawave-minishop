name: Publish Core images (reusable)

# Push each candidate to both registries from one BuildKit export.

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Commit or tag to check out"
        type: string
        required: true
      source_commit:
        description: "Immutable source commit recorded in image metadata"
        type: string
        required: true
      channel:
        description: "Publishing channel: dev or release"
        type: string
        required: true
      version:
        description: "Release version without the leading v"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  lockfiles:
    name: Validate npm lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs-site/package-lock.json

      - name: Check npm lockfiles
        run: npm run check:lockfiles

  publish:
    name: Publish ${{ matrix.image }}
    needs: lockfiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            image: remnawave-minishop-backend
          - target: worker
            image: remnawave-minishop-worker
          - target: frontend
            image: remnawave-minishop-frontend
    steps:
      - name: Validate publishing inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" != "dev" ] && [ "$CHANNEL" != "release" ]; then
            echo "Unsupported GHCR channel: $CHANNEL" >&2
            exit 1
          fi
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full Git commit SHA" >&2
            exit 1
          fi
          if [ "$CHANNEL" = "release" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use MAJOR.MINOR.PATCH form" >&2
            exit 1
          fi

      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Verify checked-out source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate GHCR metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ inputs.channel == 'dev' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ inputs.channel == 'release' }}
          labels: |
            org.opencontainers.image.ref.name=${{ inputs.channel == 'release' && format('v{0}', inputs.version) || 'dev' }}
            org.opencontainers.image.revision=${{ inputs.source_commit }}

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: ${{ inputs.channel == 'release' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:candidate-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
            docker.io/${{ github.repository_owner }}/${{ matrix.image }}:candidate-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REMNAWAVE_MINISHOP_BRANCH=${{ inputs.channel == 'release' && 'main' || 'dev' }}
            REMNAWAVE_MINISHOP_BUILD_PROVENANCE=official
            REMNAWAVE_MINISHOP_BUILD_COMMIT=${{ inputs.source_commit }}
            REMNAWAVE_MINISHOP_APK_REFRESH=${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.target }}-ghcr
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-ghcr
          provenance: mode=max
          sbom: true

      - name: Scan the published candidate
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false

      - name: Install Cosign for Docker Hub
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign and verify the Docker Hub candidate
        env:
          IMAGE: docker.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CHANNEL_TAG: ${{ inputs.channel == 'release' && inputs.version || 'dev' }}
        run: |
          set -euo pipefail
          cosign sign --yes --registry-referrers-mode oci-1-1 \
            --annotations "tag=$CHANNEL_TAG" \
            --annotations "org.opencontainers.image.revision=$SOURCE_COMMIT" "$IMAGE"
          for attempt in 1 2 3 4 5; do
            if cosign verify --experimental-oci11 \
              --annotations "tag=$CHANNEL_TAG" \
              --annotations "org.opencontainers.image.revision=$SOURCE_COMMIT" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_docker-publish-ghcr.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE" > /dev/null; then
              break
            fi
            [ "$attempt" != 5 ] || exit 1
            sleep "$((attempt * 5))"
          done

      - name: Attest the stable image
        if: inputs.channel == 'release'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: printf '%s\n' "$DIGEST" > "$TARGET.digest"

      - name: Upload verified digest
        uses: actions/upload-artifact@v7
        with:
          name: core-image-digest-${{ matrix.target }}
          path: ${{ matrix.target }}.digest
          if-no-files-found: error
          overwrite: true
          retention-days: 7
