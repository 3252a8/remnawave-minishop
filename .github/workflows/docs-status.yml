name: Docs deployment status

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: docs-status-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  reconcile:
    name: Verify published documentation
    if: github.repository == '3252a8/remnawave-minishop'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reconcile Cloudflare GitLab status after publication proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_DOCS_STATUS_TOKEN: ${{ secrets.GITLAB_DOCS_STATUS_TOKEN }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/reconcile_docs_status.py
